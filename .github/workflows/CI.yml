name: Continuous Integration (CI)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  TAG: dev_v${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set .env
        run: cp --no-clobber .env.example .env
      - name: Remove volumes in CI to avoid permission errors due to UID / GID.
        run: |
          sed -i "s|.:/code|/tmp:/tmp|g" .env*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          tags: vouch-backend:${{ env.TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UID=1000
            GID=1000
            DEBUG=true
            ENV=dev
      - name: Set docker-compose image tag
        run: |
          echo "DOCKER_IMAGE_TAG=${{ env.TAG }}" >> $GITHUB_ENV
      - name: Django Migrate
        run: |
          docker compose run --name backend_migrate_run-${{ github.run_number }} -T backend python manage.py migrate
      - name: Ruff
        run: |
          docker compose run --name backend_ruff_run-${{ github.run_number }} -T backend ruff check --output-format=github .
      - name: BasedPyright
        run: |
          docker compose run --name backend_pyright_run-${{ github.run_number }} -T backend basedpyright
      - name: PyTest
        run: |
          docker compose run --name backend_coverage_run-${{ github.run_number }} -T backend pytest --cov --cov-report html:/tmp/htmlcov --cov-report xml:/tmp/coverage.xml
      - name: Setting up Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifact
          path: /tmp/htmlcov
      - name: Get Cover
        if: ${{ github.event_name == 'pull_request' }}
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: /tmp/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stop containers
        run: docker compose down
