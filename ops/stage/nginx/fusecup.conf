upstream app_server {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 4G;
    keepalive_timeout 5;

    location /media  {
        alias /code/src/public/media;
    }

    location /static {
        alias /code/src/public/static;
    }

    location /favicon {
        alias /code/src/public/favicon;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://app_server;
    }
}