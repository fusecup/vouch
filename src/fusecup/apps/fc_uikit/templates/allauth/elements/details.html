{% load allauth %}
<details {% if attrs.open %}open{% endif %} class="group rounded-lg border p-4">
    <summary class="cursor-pointer font-medium list-none [&::-webkit-details-marker]:hidden">
        <div class="flex items-center justify-between">
            <span>
                {% slot summary %}
                {% endslot %}
            </span>
            <svg class="size-4 shrink-0 transition-transform group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </div>
    </summary>
    <div class="mt-4 text-sm text-muted-foreground">
        {% slot body %}
        {% endslot %}
    </div>
</details>
