{% load allauth %}
{% c uikit.card %}
    {% c uikit.card.header %}
        <h3 class="text-lg font-semibold leading-none tracking-tight">
            {% slot title %}
            {% endslot %}
        </h3>
    {% endc %}
    {% c uikit.card.content %}
        {% slot body %}
        {% endslot %}
        {% if slots.actions %}
            <div class="mt-6 flex flex-col gap-2">
                {% for action in slots.actions %}{{ action }}{% endfor %}
            </div>
        {% endif %}
    {% endc %}
{% endc %}
