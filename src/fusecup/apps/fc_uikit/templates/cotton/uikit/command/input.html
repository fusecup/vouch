<c-vars placeholder>
</c-vars>
{% comment %} djlint:off {% endcomment %}
<div class="grid grid-cols-1">
  <div class="col-start-1 row-start-1 border-b border-input">
  <input
    x-model="search"
    type="text"
    class="block w-full rounded-md bg-transparent py-3 pr-3 pl-9 text-sm border-none focus-visible:ring-0 outline-none placeholder:text-muted-foreground/60 disabled:cursor-not-allowed disabled:opacity-50
    {% if class %}{{ class }}{% endif %}"
    placeholder="{{ placeholder }}"
    {{ attrs }}
  />
</div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="pointer-events-none col-start-1 row-start-1 ml-3 size-4 self-center text-muted-foreground/60"
  >
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.3-4.3"></path>
  </svg>
</div>
