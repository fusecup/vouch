<c-vars as_child="false">
</c-vars>
{% comment %} djlint:off {% endcomment %}
{% if as_child == "true" %}
  <div
    @click.stop="$dispatch('show-dialog')"
    class="{% if class %}{{ class }}{% endif %}"
    {{ attrs }}
  >
    {{ slot }}
  </div>
{% else %}
  <c-uikit.button
    variant="outline"
    @click.stop="showDialog()"
    class="{% if class %}{{ class }}{% endif %}"
    {{ attrs }}
  >
    {{ slot }}
  </c-uikit.button>
{% endif %}
