{% extends "base.html" %}
{% block page_title %}Profile{% endblock page_title %}
{% block content %}
  <section class="px-4 py-8">
    <h1 class="mb-4 text-2xl font-semibold">Profile</h1>
    {% include "activity/_nav.html" %}
    <div class="max-w-2xl rounded border p-5">
      <div class="mb-2 text-sm text-muted-foreground">Signed in as</div>
      <div class="text-lg font-semibold">{{ user_name }}</div>
      <div class="mb-4 text-sm">{{ user_email }}</div>
      <div class="flex flex-wrap gap-2">
        <a href="/a/email/" class="rounded border px-3 py-2 text-sm">Manage Email</a>
        <a href="/a/password/change/" class="rounded border px-3 py-2 text-sm">Change Password</a>
        <a href="/a/sessions/" class="rounded border px-3 py-2 text-sm">Active Sessions</a>
      </div>
    </div>
  </section>
{% endblock content %}
